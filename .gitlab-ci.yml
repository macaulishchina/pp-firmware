pages:
  image: node:22
  stage: deploy
  script:
    - cd site
    - npm ci
    - npm run build
    - cp -R config dist/config
    - cp -R assets dist/assets
    - cp assets/favicon.ico dist/favicon.ico
    - cp -R ../releases dist/firmware
    - mv dist ../public
  artifacts:
    paths:
      - public
  only:
    - gh-pages
