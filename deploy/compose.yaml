services:
  website:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    pull_policy: never
    container_name: pp-firmware-site
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    ports:
      - "110.0.0.82:9443:8443"
      - "127.0.0.1:9443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dist:/usr/share/nginx/html:ro
      - ../public/pp-demo:/usr/share/nginx/html/pp-demo:ro
      - ../config:/srv/catalog:ro
      - ../../releases:/srv/releases:ro
      - ../../private/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ../../private/tls/server-key.pem:/etc/nginx/tls/server-key.pem:ro
      - ../../private/tls/ca.crt:/srv/ca/pp-firmware-ca.crt:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz | grep -qx ok"]
      interval: 30s
      timeout: 10s
      retries: 3
