worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  server_tokens off;
  server {
    listen 8443 ssl;
    server_name 47.109.34.254 110.0.0.82 localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy 'serial=(self)' always;
    location ~ /\. { return 404; }
    location ~ ^/(private|candidates|src|deploy|tools|tests)(/|$) { return 404; }
    location = /healthz { default_type text/plain; return 200 'ok\n'; }
    location = /pa/passport/pair {
      proxy_pass http://192.168.32.1:8047/entrances/ai_passport/pair;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Host $http_host;
      proxy_buffering off;
      proxy_read_timeout 30s;
      client_max_body_size 4k;
      access_log off;
    }
    location = /pa/passport/stream {
      proxy_pass http://192.168.32.1:8047/entrances/ai_passport/stream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header Host $http_host;
      proxy_buffering off;
      proxy_read_timeout 65s;
      proxy_send_timeout 65s;
      access_log off;
    }
    location = /config/pp.toml {
      alias /srv/catalog/pp.toml;
      default_type text/plain;
      add_header Cache-Control 'no-store';
    }
    location /firmware/ {
      alias /srv/releases/;
      autoindex off;
      disable_symlinks on;
      add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location = /certs/pp-firmware-ca.crt {
      alias /srv/ca/pp-firmware-ca.crt;
      default_type application/x-x509-ca-cert;
      add_header Content-Disposition 'attachment; filename="pp-firmware-ca.crt"';
    }
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
  }
}
