services:
  website:
    image: nginx@sha256:1d13701a5f9f3fb01aaa88cef2344d65b6b5bf6b7d9fa4cf0dca557a8d7702ba
    pull_policy: never
    container_name: pp-firmware-site
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    ports:
      - "110.0.0.82:9443:8443"
      - "127.0.0.1:9443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dist:/usr/share/nginx/html:ro
      - ../../runtime/passportsim:/srv/pp-sim:ro
      - ../../runtime/passportsim-service:/run/pp-sim:ro
      - ../config:/srv/catalog:ro
      - ../../releases:/srv/releases:ro
      - type: bind
        source: ${SITE_TLS_DIR:?Set SITE_TLS_DIR in deploy/.env or the shell}
        target: /etc/nginx/tls
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/healthz | grep -qx ok"]
      interval: 30s
      timeout: 10s
      retries: 3
