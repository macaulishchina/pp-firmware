worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  sendfile on;
  server_tokens off;
  map $http_upgrade $pp_sim_connection {
    default upgrade;
    '' close;
  }
  upstream pp_sim_sessions {
    server unix:/run/pp-sim/public.sock;
  }
  server {
    listen 8443 ssl;
    server_name 47.109.34.254 110.0.0.82 localhost;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy 'serial=(self)' always;
    location ~ /\. { return 404; }
    location ~ ^/(private|candidates|src|deploy|tools|tests)(/|$) { return 404; }
    location = /healthz { default_type text/plain; return 200 'ok\n'; }
    location = /pp-sim {
      absolute_redirect off;
      access_log off;
      return 308 /pp-sim/$is_args$args;
    }
    location ^~ /pp-sim/api/ {
      access_log off;
      client_max_body_size 4k;
      proxy_pass http://pp_sim_sessions/;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $pp_sim_connection;
      proxy_read_timeout 75s;
      add_header Cache-Control no-store always;
      add_header Referrer-Policy no-referrer always;
    }
    location /pp-sim/ {
      access_log off;
      error_log /dev/stderr crit;
      alias /srv/pp-sim/;
      index index.html;
      limit_except GET { deny all; }
      try_files $uri $uri/ =404;
      add_header Cross-Origin-Opener-Policy same-origin always;
      add_header Cross-Origin-Embedder-Policy require-corp always;
      add_header Cross-Origin-Resource-Policy same-origin always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy same-origin always;
      add_header Cache-Control no-cache;
    }
    location = /config/pp.toml {
      alias /srv/catalog/pp.toml;
      default_type text/plain;
      add_header Cache-Control 'no-store';
    }
    location /firmware/ {
      alias /srv/releases/;
      autoindex off;
      disable_symlinks on;
      add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location = /certs/pp-firmware-ca.crt {
      alias /srv/ca/pp-firmware-ca.crt;
      default_type application/x-x509-ca-cert;
      add_header Content-Disposition 'attachment; filename="pp-firmware-ca.crt"';
    }
    location / { limit_except GET { deny all; } try_files $uri $uri/ =404; }
  }
}
